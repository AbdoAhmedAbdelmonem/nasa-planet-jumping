<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Planet Jumping — Mars Portal</title>
    <meta name="description" content="An immersive cinematic journey from Mars through the inner Solar System." />
    <meta property="og:title" content="Planet Jumping — Mars Portal" />
    <meta property="og:description" content="An immersive cinematic journey from Mars through the inner Solar System." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      @font-face{font-family:'SF Pro';font-style:normal;font-weight:400;src:local('SF Pro Display'),local('SF Pro Text')}
      @font-face{font-family:'SF Pro';font-style:normal;font-weight:700;src:local('SF Pro Display Bold'),local('SF Pro Text Bold')}
      @font-face{font-family:'SF Pro Thin';font-style:normal;font-weight:100;src:local('SF Pro Display Thin'),local('SF Pro Text Thin')}
      @font-face{font-family:'Aalto';font-style:normal;font-weight:400;src:local('Aalto Display'),local('Aalto')}
      :root{font-family:'SF Pro',Arial,sans-serif;color:#fff;background:#090807;font-synthesis:none}
      *{box-sizing:border-box}
      html,body{margin:0;width:100%;height:100%;overflow:hidden}
      html,body,button,a,.portal{cursor:none!important}
      button,a{font:inherit}
      .experience{position:relative;width:100%;height:100%;min-height:540px;overflow:hidden;background:#0a0908}
      .backgrounds,.background,.shade,.transition-layer,.transition-layer video{position:absolute;inset:0;width:100%;height:100%}
      .background{object-fit:cover;opacity:0;transition:opacity .8s ease}
      .background.is-visible{opacity:1}
      .shade{z-index:1;background:linear-gradient(to bottom,transparent 52%,rgba(0,0,0,.88) 100%);pointer-events:none}
      .chrome{position:absolute;z-index:4;transition:opacity .45s ease,filter .45s ease}
      .experience.is-transitioning .chrome{opacity:0;filter:blur(8px);pointer-events:none}
      .header{left:clamp(18px,1.95vw,28px);right:clamp(18px,1.95vw,28px);top:clamp(18px,3.1vh,28px);display:flex;justify-content:space-between;align-items:center}
      .logo-slot{width:37px;height:36px}
      .header-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
      .nav{display:flex;align-items:center;height:42px;padding:4px 5px;border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.1);backdrop-filter:blur(12px);border-radius:999px}
      .nav a{color:#fff;text-decoration:none;padding:8px 19px;border-radius:999px;line-height:1}
      .nav a.active{background:#fff;color:#000}
      .menu{height:42px;padding:0 20px;border:0;border-radius:999px;background:#fff;color:#000;cursor:pointer}
      .planet-list{left:clamp(18px,1.95vw,28px);top:50%;transform:translateY(-43%);display:flex;flex-direction:column;gap:6px;font-size:16px}
      .planet-item{display:flex;align-items:center;min-height:20px}
      .planet-item.active{font-size:18px;font-weight:700;gap:8px}
      .planet-item.active:before{content:'';width:16px;height:16px;border-radius:50%;background:#fff}
      .portal-wrap{left:50%;top:50%;width:min(320px,31vw);transform:translate(-50%,-54%);perspective:none}
      .portal-heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:16px;opacity:0}
      .portal-heading strong{font-size:18px;margin-left:8px}
      .portal{position:relative;display:block;width:100%;aspect-ratio:320/350;padding:0;overflow:visible;border:0;border-radius:90px;background:transparent;cursor:pointer;box-shadow:none;transform:none!important}
      .portal video,.portal img{visibility:hidden;position:absolute;width:1px;height:1px;pointer-events:none}
      .portal-canvas{position:fixed;inset:0;z-index:3;width:100%;height:100%;pointer-events:none}
      .planet-content{left:clamp(28px,4vw,58px);right:clamp(28px,3vw,44px);bottom:clamp(24px,3vh,30px);display:flex;justify-content:space-between;align-items:flex-end;gap:40px}
      .planet-content h1{font-family:Aalto,'Arial Narrow',sans-serif;font-stretch:condensed;font-size:clamp(128px,21.8vw,314px);font-weight:400;line-height:.72;margin:0 0 -.04em;letter-spacing:0;transform:translateX(-32px);opacity:0}
      .planet-content dl{width:min(447px,34vw);margin:0;font-size:16px}
      .fact{display:grid;grid-template-columns:138px 1fr;gap:18px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.48);opacity:0}
      .fact:last-child{border-bottom:0}.fact dt{font-weight:700}.fact dd{margin:0}
      .transition-layer{display:none}.scene-canvas{display:none}
      .loading{position:absolute;z-index:12;left:50%;bottom:30px;transform:translateX(-50%);opacity:0;font-size:12px;letter-spacing:.14em;text-transform:uppercase;transition:opacity .2s}
      .experience.is-loading .loading{opacity:.8}
      .experience.is-transitioning .header,.experience.is-transitioning .planet-list{opacity:1;filter:none;pointer-events:auto}
      .experience.is-transitioning .shade{opacity:1}
      .experience.is-committing .background{transition:none!important}
      .preloader{position:absolute;inset:0;z-index:20;background:#000;overflow:hidden}
      .preloader video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
      .preloader-shade{position:absolute;inset:auto 0 0;height:35%;background:linear-gradient(to bottom,transparent,#000)}
      .preloader.is-background{z-index:0}.preloader.is-background .preloader-shade{opacity:0}
      .floating-logo{position:fixed;z-index:22;left:50%;top:50%;width:59px;height:58px;transform:translate(-50%,-50%);will-change:left,top,width,height,transform;transition:left 2s cubic-bezier(.16,1,.3,1),top 2s cubic-bezier(.16,1,.3,1),width 2s cubic-bezier(.16,1,.3,1),height 2s cubic-bezier(.16,1,.3,1),transform 2s cubic-bezier(.16,1,.3,1)}
      .floating-logo.is-docked{left:clamp(18px,1.95vw,28px);top:clamp(18px,3.1vh,28px);width:37px;height:36px;transform:none}
      .floating-logo.is-settled{z-index:5}
      .preloader-count{position:fixed;z-index:22;left:50%;bottom:clamp(22px,3.1vh,28px);display:flex;align-items:flex-end;gap:4px;transform:translateX(-50%);font-family:'SF Pro',Arial,sans-serif;line-height:1}
      .preloader-count>span:first-child{font-family:'SF Pro Thin','SF Pro',Arial,sans-serif;font-size:64px;font-weight:100}
      .preloader-count .percent{font-size:24px;padding-bottom:4px}
      .preloader-count.is-leaving{animation:preload-count-out .75s cubic-bezier(.22,1,.36,1) both}
      @keyframes preload-count-out{to{opacity:0;filter:blur(7px);transform:translate(-50%,-34px)}}
      body:not(.preload-complete) .custom-cursor{opacity:0!important}
      .custom-cursor{display:block;position:fixed;left:0;top:0;z-index:100;width:1px;height:1px;pointer-events:none;opacity:0;transition:opacity .2s ease}
      .custom-cursor.is-visible{opacity:1}
      .cursor-dot,.cursor-orbit{position:absolute;left:0;top:0;border-radius:50%;transform:translate(-50%,-50%)}
      .cursor-dot{width:12px;height:12px;background:#fff}
      .cursor-orbit{width:36px;height:36px;border:1px solid #fff;background:rgba(255,255,255,.4);transition:transform .3s cubic-bezier(.22,1,.36,1)}
      .custom-cursor.is-enter .cursor-orbit{transform:translate(-50%,-50%) scale(1.16)}
      .cursor-label{position:absolute;top:26px;left:0;transform:translateX(-50%) translateY(-4px);font:16px/1.2 'SF Pro',Arial,sans-serif;white-space:nowrap;opacity:0;transition:opacity .2s ease,transform .3s cubic-bezier(.22,1,.36,1)}
      .custom-cursor.is-enter .cursor-label{opacity:1;transform:translateX(-50%) translateY(0)}
      body:not(.intro-ready) .header,body:not(.intro-ready) .planet-list,body:not(.intro-ready) .planet-content h1,body:not(.intro-ready) .planet-content .fact{opacity:0}
      .intro-ready .header{animation:reveal-down .9s cubic-bezier(.22,1,.36,1) .1s both}
      .intro-ready .planet-list{animation:reveal-side .9s cubic-bezier(.22,1,.36,1) .65s both}
      .content-revealing h1{animation:title-rise 1.05s cubic-bezier(.16,1,.3,1) both}
      .content-revealing .fact{animation:fact-rise .72s cubic-bezier(.22,1,.36,1) both}
      .content-revealing .fact:nth-child(1){animation-delay:.52s}.content-revealing .fact:nth-child(2){animation-delay:.68s}.content-revealing .fact:nth-child(3){animation-delay:.84s}.content-revealing .fact:nth-child(4){animation-delay:1s}
      .mask-revealing .portal-heading{animation:portal-caption .85s cubic-bezier(.22,1,.36,1) both}
      .planet-list.is-switching .planet-item{animation:menu-row .58s cubic-bezier(.22,1,.36,1) both}
      .planet-list.is-switching .planet-item:nth-child(1){animation-delay:.02s}.planet-list.is-switching .planet-item:nth-child(2){animation-delay:.05s}.planet-list.is-switching .planet-item:nth-child(3){animation-delay:.08s}.planet-list.is-switching .planet-item:nth-child(4){animation-delay:.11s}.planet-list.is-switching .planet-item:nth-child(5){animation-delay:.14s}.planet-list.is-switching .planet-item:nth-child(6){animation-delay:.17s}.planet-list.is-switching .planet-item:nth-child(7){animation-delay:.2s}.planet-list.is-switching .planet-item:nth-child(8){animation-delay:.23s}
      .planet-list.is-switching .planet-item.active:before{animation:active-dot .55s cubic-bezier(.22,1,.36,1) .18s both}
      @keyframes reveal-down{from{opacity:0;filter:blur(8px);transform:translateY(-18px)}to{opacity:1;filter:blur(0);transform:translateY(0)}}
      @keyframes reveal-side{from{opacity:0;filter:blur(8px);transform:translate(-20px,-43%)}to{opacity:1;filter:blur(0);transform:translate(0,-43%)}}
      @keyframes title-rise{from{opacity:0;filter:blur(12px);transform:translate(-32px,42px)}to{opacity:1;filter:blur(0);transform:translate(-32px,0)}}
      @keyframes fact-rise{from{opacity:0;filter:blur(7px);transform:translateY(18px)}to{opacity:1;filter:blur(0);transform:translateY(0)}}
      @keyframes portal-caption{from{opacity:0;filter:blur(7px);transform:translateY(22px)}to{opacity:1;filter:blur(0);transform:translateY(0)}}
      @keyframes menu-row{from{opacity:.35;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}
      @keyframes active-dot{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}
      @media(max-width:900px){.nav{display:none}.portal-wrap{width:min(300px,48vw)}.planet-content h1{font-size:clamp(105px,24vw,190px)}.planet-content dl{width:43vw}.fact{grid-template-columns:110px 1fr}.planet-list{font-size:14px}.planet-item.active{font-size:16px}}
      @media(max-width:640px){.experience{min-height:600px}.planet-list{display:none}.portal-wrap{top:44%;width:min(260px,66vw)}.planet-content{left:18px;right:18px;bottom:18px;display:block}.planet-content h1{font-size:clamp(98px,30vw,160px);margin-bottom:20px}.planet-content dl{width:100%;font-size:13px}.fact{grid-template-columns:92px 1fr;padding:5px 0}.portal-heading{font-size:14px}.portal-heading strong{font-size:16px}.menu{height:38px}.portal{border-radius:70px}}
      @media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}.portal{transform:none!important}}
    </style>
  </head>
  <body>
    <main id="experience" class="experience" data-planet="mars">
      <div class="backgrounds" aria-hidden="true">
        <video class="background mars-background" muted playsinline preload="auto" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/3c83091e-4046-4fd6-adbb-2edb728be79a.mp4"></video>
        <video class="background earth-background" muted playsinline preload="auto" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/fc3ded42-e845-41f3-a830-5cab512d79cd.mp4"></video>
        <video class="background venus-background" muted playsinline preload="auto" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/b30f64d9-1637-477a-83df-d0fc6461a422.mp4"></video>
      </div>
      <div class="shade"></div>
      <header class="header chrome">
        <div class="logo-slot" aria-hidden="true"></div>
        <div class="header-actions">
          <nav class="nav" aria-label="Primary"><a href="#about">About</a><a class="active" href="#explore">Explore</a><a href="#planets">Planets</a></nav>
          <button class="menu" type="button">Menu</button>
        </div>
      </header>
      <aside class="planet-list chrome" aria-label="Planets"></aside>
      <section class="portal-wrap chrome">
        <div class="portal-heading"><span>Next:</span><strong><span id="next-number">[03]</span> <span id="next-name">Earth</span></strong></div>
        <button id="portal" class="portal" type="button" aria-label="Travel to Earth">
          <video id="portal-video" muted playsinline preload="auto"></video>
          <img id="portal-image" alt="Mercury seen through the portal" />
        </button>
      </section>
      <section class="planet-content chrome">
        <h1 id="planet-title">MARS</h1>
        <dl id="facts"></dl>
      </section>
      <canvas id="portal-canvas" class="portal-canvas" aria-hidden="true"></canvas>
      <canvas id="scene-canvas" class="scene-canvas" aria-hidden="true"></canvas>
      <div class="transition-layer" aria-hidden="true"><video id="transition-video" muted playsinline preload="auto"></video></div>
      <div class="loading">Preparing orbit…</div>
      <div id="preloader" class="preloader">
        <video id="preloader-video" muted playsinline preload="auto" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/3c83091e-4046-4fd6-adbb-2edb728be79a.mp4"></video>
        <div class="preloader-shade"></div>
      </div>
      <img id="floating-logo" class="floating-logo" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/eb7e0f53-50cd-4af5-abc4-8b9a52cdc01b.svg" alt="Planet Jumping" />
      <div id="preloader-count" class="preloader-count"><span id="preloader-value">0</span><span class="percent">%</span></div>
      <div id="custom-cursor" class="custom-cursor" aria-hidden="true"><span class="cursor-orbit"></span><span class="cursor-dot"></span><span class="cursor-label">Enter</span></div>
    </main>
    <script>
      (() => {
        'use strict';
        const BASE='https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P';
        const TO_EARTH=BASE+'/fc3ded42-e845-41f3-a830-5cab512d79cd.mp4';
        const TO_VENUS=BASE+'/b30f64d9-1637-477a-83df-d0fc6461a422.mp4';
        const MERCURY=BASE+'/d6fb8b6b-c15e-4aaa-9cf7-45bbb5e33372.jpg';
        const planets=['Mercury','Venus','Earth','Mars','Jupiter','Saturn','Uranus','Neptune'];
        const states={
          mars:{name:'Mars',next:'Earth',number:'[03]',portal:TO_EARTH,background:'mars-background',facts:[['Distance:','About 228 million km (1.5 astronomical units).'],['Year:','One Martian year is equal to 687 Earth days.'],['Temperature:','Around -60 °C, dropping to -125 °C at the poles in winter.'],['Atmosphere:','Very thin, consisting of 95% carbon dioxide, with frequent dust storms.']]},
          earth:{name:'Earth',next:'Venus',number:'[02]',portal:TO_VENUS,background:'earth-background',facts:[['Distance:','149.6 million km from the Sun.'],['Year:','365.25 Earth days.'],['Temperature:','Average surface temperature around 15 °C.'],['Atmosphere:','Mostly nitrogen and oxygen, supporting life and liquid water.']]},
          venus:{name:'Venus',next:'Mercury',number:'[06]',image:MERCURY,background:'venus-background',facts:[['Distance:','108.2 million km from the Sun.'],['Year:','225 Earth days.'],['Temperature:','Around 465 °C — the hottest planet in the Solar System.'],['Atmosphere:','Extremely dense, mostly carbon dioxide, with clouds of sulfuric acid.']]}
        };
        const experience=document.getElementById('experience');
        const portal=document.getElementById('portal');
        const portalVideo=document.getElementById('portal-video');
        const portalImage=document.getElementById('portal-image');
        const transitionVideo=document.getElementById('transition-video');
        const canvas=document.getElementById('portal-canvas');
        const sceneCanvas=document.getElementById('scene-canvas');
        const ctx=canvas.getContext('2d');
        const sceneCtx=sceneCanvas.getContext('2d');
        const list=document.querySelector('.planet-list');
        let current='mars',firstRender=true,busy=false,transitionActive=false,frozenScene=false;
        let expansion=0,maskScale=0,canvasOpacity=1,rotX=0,rotY=0,targetX=0,targetY=0,lastFrame=performance.now();

        function render(){
          const state=states[current];
          experience.dataset.planet=current;
          document.getElementById('planet-title').textContent=state.name.toUpperCase();
          document.getElementById('next-name').textContent=state.next;
          document.getElementById('next-number').textContent=state.number;
          portal.setAttribute('aria-label','Travel to '+state.next);
          document.getElementById('facts').innerHTML=state.facts.map(([key,value])=>'<div class="fact"><dt>'+key+'</dt><dd>'+value+'</dd></div>').join('');
          list.innerHTML=planets.map(name=>'<div class="planet-item'+(name.toLowerCase()===current?' active':'')+'">'+name+'</div>').join('');
          if(!firstRender){list.classList.remove('is-switching');void list.offsetWidth;list.classList.add('is-switching');}
          firstRender=false;
          document.querySelectorAll('.background').forEach(video=>video.classList.toggle('is-visible',video.classList.contains(state.background)));
          if(state.image){portalImage.src=state.image;portalImage.hidden=false;portalVideo.hidden=true;}
          else{portalImage.hidden=true;portalVideo.hidden=false;if(portalVideo.src!==state.portal){portalVideo.src=state.portal;portalVideo.load();}}
        }

        function resizeCanvas(){
          const d=Math.min(devicePixelRatio||1,2);
          canvas.width=innerWidth*d;canvas.height=innerHeight*d;canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.setTransform(d,0,0,d,0,0);
          if(!frozenScene){sceneCanvas.width=innerWidth*d;sceneCanvas.height=innerHeight*d;sceneCanvas.style.width=innerWidth+'px';sceneCanvas.style.height=innerHeight+'px';sceneCtx.setTransform(d,0,0,d,0,0);}
        }
        function drawCover(context,media){
          const mw=media.videoWidth||media.naturalWidth||0,mh=media.videoHeight||media.naturalHeight||0;if(!mw||!mh)return;
          const scale=Math.max(innerWidth/mw,innerHeight/mh),w=mw*scale,h=mh*scale;
          context.drawImage(media,(innerWidth-w)/2,(innerHeight-h)/2,w,h);
        }
        function drawShade(context){
          const gradient=context.createLinearGradient(0,innerHeight*.52,0,innerHeight);gradient.addColorStop(0,'rgba(0,0,0,0)');gradient.addColorStop(1,'rgba(0,0,0,.88)');context.fillStyle=gradient;context.fillRect(0,innerHeight*.52,innerWidth,innerHeight*.48);
        }
        function roundedPoints(w,h,r){
          r=Math.min(r,w/2,h/2);const corners=[[w/2-r,-h/2+r,-Math.PI/2,0],[w/2-r,h/2-r,0,Math.PI/2],[-w/2+r,h/2-r,Math.PI/2,Math.PI],[-w/2+r,-h/2+r,Math.PI,Math.PI*1.5]],points=[];
          corners.forEach(([cx,cy,start,end])=>{for(let i=0;i<=10;i++){const a=start+(end-start)*(i/10);points.push([cx+Math.cos(a)*r,cy+Math.sin(a)*r]);}});return points;
        }
        function project(x,y,cx,cy,rx,ry){
          const ax=rx*Math.PI/180,ay=ry*Math.PI/180,xx=x*Math.cos(ay),yy=y*Math.cos(ax),z=x*Math.sin(ay)-y*Math.sin(ax),p=850/(850+z);return[cx+xx*p,cy+yy*p];
        }
        function draw(now){
          const dt=Math.min(40,now-lastFrame);lastFrame=now;rotX+=(targetX-rotX)*Math.min(1,dt*.009);rotY+=(targetY-rotY)*Math.min(1,dt*.009);
          ctx.clearRect(0,0,innerWidth,innerHeight);if(frozenScene){ctx.drawImage(sceneCanvas,0,0,innerWidth,innerHeight);drawShade(ctx);}
          const rect=portal.getBoundingClientRect(),e=expansion,cx=rect.left+rect.width/2+(innerWidth/2-(rect.left+rect.width/2))*e,cy=rect.top+rect.height/2+(innerHeight/2-(rect.top+rect.height/2))*e;
          const baseW=rect.width+(innerWidth-rect.width)*e,baseH=rect.height+(innerHeight-rect.height)*e,scale=e?1:maskScale,w=baseW*scale,h=baseH*scale,r=90*(1-e)*scale,rx=rotX*(1-e),ry=rotY*(1-e);
          if(w>1&&h>1){const points=roundedPoints(w,h,r).map(([x,y])=>project(x,y,cx,cy,rx,ry));ctx.save();ctx.globalAlpha=canvasOpacity;ctx.beginPath();points.forEach((point,i)=>i?ctx.lineTo(point[0],point[1]):ctx.moveTo(point[0],point[1]));ctx.closePath();ctx.clip();ctx.fillStyle='#030303';ctx.fillRect(0,0,innerWidth,innerHeight);const media=transitionActive?transitionVideo:(states[current].image?portalImage:portalVideo);drawCover(ctx,media);if(transitionActive)drawShade(ctx);ctx.restore();}
          requestAnimationFrame(draw);
        }
        const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
        function animateValue(setter,duration){return new Promise(resolve=>{const start=performance.now();function step(now){const raw=Math.min(1,(now-start)/duration);setter(ease(raw));if(raw<1)requestAnimationFrame(step);else resolve();}requestAnimationFrame(step);});}
        function retrigger(className){experience.classList.remove(className);void experience.offsetWidth;experience.classList.add(className);}
        function revealMask(){retrigger('mask-revealing');maskScale=0;return animateValue(value=>maskScale=value,1050);}
        function revealPlanetContent(){retrigger('content-revealing');}
        function waitForMedia(media,timeout=2200){return new Promise(resolve=>{if((media.tagName==='IMG'&&media.complete&&media.naturalWidth)||(media.tagName==='VIDEO'&&media.readyState>=3)){resolve();return;}let done=false;const finish=()=>{if(done)return;done=true;clearTimeout(timer);media.removeEventListener('canplaythrough',finish);media.removeEventListener('load',finish);media.removeEventListener('error',finish);resolve();};const timer=setTimeout(finish,timeout);media.addEventListener('canplaythrough',finish,{once:true});media.addEventListener('load',finish,{once:true});media.addEventListener('error',finish,{once:true});});}
        async function startExperience(){const state=states[current];await waitForMedia(state.image?portalImage:portalVideo);await revealMask();document.body.classList.add('intro-ready');setTimeout(revealPlanetContent,850);}
        function waitForEnd(video){return new Promise(resolve=>{if(video.ended){resolve();return;}const done=()=>resolve();video.addEventListener('ended',done,{once:true});video.addEventListener('error',done,{once:true});});}
        async function travel(){
          if(busy||current==='venus')return;busy=true;targetX=targetY=0;const next=current==='mars'?'earth':'venus';
          try{
            transitionVideo.src=states[current].portal;transitionVideo.load();experience.classList.add('is-loading');await waitForMedia(transitionVideo,1600);
            experience.classList.remove('is-loading','content-revealing','mask-revealing');experience.classList.add('is-transitioning');transitionVideo.currentTime=0;transitionVideo.playbackRate=1.3;canvasOpacity=1;transitionActive=true;
            const playback=transitionVideo.play();if(playback)await playback;await animateValue(value=>expansion=value,1100);await waitForEnd(transitionVideo);
            sceneCtx.clearRect(0,0,innerWidth,innerHeight);drawCover(sceneCtx,transitionVideo);frozenScene=true;current=next;experience.classList.add('is-committing');render();await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
            transitionActive=false;expansion=0;maskScale=0;canvasOpacity=1;experience.classList.remove('is-transitioning','is-committing');const maskReveal=revealMask();setTimeout(revealPlanetContent,100);await maskReveal;
            setTimeout(()=>{transitionVideo.removeAttribute('src');transitionVideo.load();busy=false;},450);
          }catch(error){transitionActive=false;expansion=0;maskScale=1;canvasOpacity=1;experience.classList.remove('is-loading','is-transitioning','is-committing');busy=false;}
        }
        portal.addEventListener('click',travel);
        if(matchMedia('(pointer:fine)').matches){document.addEventListener('pointermove',event=>{if(!busy){targetY=(event.clientX/innerWidth-.5)*37.4;targetX=(event.clientY/innerHeight-.5)*-33;}});document.addEventListener('pointerleave',()=>{targetX=targetY=0;});}

        const cursor=document.getElementById('custom-cursor');let pointerX=innerWidth/2,pointerY=innerHeight/2,orbitX=pointerX,orbitY=pointerY;
        document.addEventListener('pointermove',event=>{pointerX=event.clientX;pointerY=event.clientY;cursor.classList.add('is-visible');});document.addEventListener('mouseleave',()=>cursor.classList.remove('is-visible'));
        portal.addEventListener('pointerenter',()=>cursor.classList.add('is-enter'));portal.addEventListener('pointerleave',()=>cursor.classList.remove('is-enter'));
        function cursorLoop(){orbitX+=(pointerX-orbitX)*.2;orbitY+=(pointerY-orbitY)*.2;cursor.style.transform='translate3d('+orbitX+'px,'+orbitY+'px,0)';requestAnimationFrame(cursorLoop);}
        function runPreloader(){
          const video=document.getElementById('preloader-video'),value=document.getElementById('preloader-value'),counter=document.getElementById('preloader-count'),logo=document.getElementById('floating-logo'),preloader=document.getElementById('preloader');let finished=false,raf=0;
          const update=()=>{if(video.duration&&Number.isFinite(video.duration))value.textContent=String(Math.round(video.currentTime/video.duration*100));raf=requestAnimationFrame(update);};
          const finish=()=>{if(finished)return;finished=true;cancelAnimationFrame(raf);value.textContent='100';counter.classList.add('is-leaving');logo.classList.add('is-docked');preloader.classList.add('is-background');document.body.classList.add('preload-complete');startExperience();setTimeout(()=>counter.remove(),750);setTimeout(()=>logo.classList.add('is-settled'),2000);};
          const begin=()=>{if(video.duration&&Number.isFinite(video.duration))video.playbackRate=Math.max(.25,video.duration/3);video.play().then(()=>{update();}).catch(finish);};
          video.addEventListener('ended',finish,{once:true});setTimeout(finish,5000);if(video.readyState>=1)begin();else video.addEventListener('loadedmetadata',begin,{once:true});
        }
        window.addEventListener('resize',resizeCanvas);
        document.querySelectorAll('.background').forEach(video=>{video.pause();video.currentTime=0;});
        resizeCanvas();render();requestAnimationFrame(draw);requestAnimationFrame(cursorLoop);runPreloader();
      })();
    </script>
  </body>
</html>
