        // =====================================================================

        // [0.0s - 1.0s] Lower-center 3D Earth Globe with stars rotates to [lon, lat]
        // [1.0s - 2.6s] Hyper-fast supersonic atmospheric entry & 3D cloud plunge
        // [2.6s - 4.2s] Smooth gradual Ease-Out deceleration pitching up over 3D terrain
        // [4.2s - 6.0s] 2-Second steady final vista hold on the landed location

        function runEarth3DFlight(zone){
          return new Promise(resolve=>{
            const duration=5800;
            const startLon=zone.lon-42;
            const startLat=Math.max(-55,Math.min(55,zone.lat*0.45));
            const targetLon=zone.lon;
            const targetLat=zone.lat;
            const targetZoom=zone.targetZoom||13.2;
            const targetPitch=zone.targetPitch||70;
            const targetBearing=zone.targetBearing||24;
            const orbitalPadTop=Math.round(innerHeight*0.24);
            let prewarmedTiles=false;
            const t0=performance.now();

            function step(now){
              const elapsed=now-t0;
              const t=Math.min(5.8,elapsed/1000);

              if(t<1.05){
                // STAGE 1: [0.0s - 1.05s] Orbital Globe Rotation in Space (stars visible behind curved limb)
                const p1=ease(t/1.05);
                const lon=startLon+(targetLon-startLon)*p1;
                const lat=startLat+(targetLat-startLat)*p1;
                const zoom=1.60+0.65*p1;
                earthStarAlpha=1;
                earthCloudAlpha=0;
                earthMap.jumpTo({
                  center:[lon,lat],
                  zoom,
                  pitch:14+6*p1,
                  bearing:-18*p1,
                  padding:{top:Math.round(orbitalPadTop*(1-p1*0.35)),bottom:0,left:0,right:0}
                });
              }else if(t<2.65){
                // STAGE 2: [1.05s - 2.65s] HYPER-FAST SUPERSONIC ATMOSPHERIC & VOLUMETRIC CLOUD ENTRY
                const p2=(t-1.05)/1.60;
                // Exponential supersonic acceleration into the atmosphere
                const pFast=p2*p2*(3-2*p2);
                const zoom=2.25+(10.85-2.25)*pFast;
                const padTop=Math.round(orbitalPadTop*0.65*(1-pFast));
                earthStarAlpha=Math.max(0,1-p2*2.2);
                earthCloudPhase=p2;
                // Bell-curve volumetric cloud opacity peaking as we punch through the cloud deck
                earthCloudAlpha=Math.sin(p2*Math.PI)*0.95;

                // While cloud veil is thickest (p2 in 0.48..0.68), pre-trigger target tile fetch at ground zoom
                if(p2>0.48&&p2<0.66&&!prewarmedTiles){
                  prewarmedTiles=true;
                  earthMap.jumpTo({
                    center:[targetLon,targetLat],
                    zoom:targetZoom-0.4,
                    pitch:targetPitch-6,
                    bearing:targetBearing-8,
                    padding:{top:0,bottom:0,left:0,right:0}
                  });
                }else{
                  earthMap.jumpTo({
                    center:[targetLon,targetLat],
                    zoom,
                    pitch:20+22*pFast,
                    bearing:-18+(targetBearing-12+18)*pFast,
                    padding:{top:padTop,bottom:0,left:0,right:0}
                  });
                }
              }else if(t<4.15){
                // STAGE 3: [2.65s - 4.15s] SMOOTH GRADUAL EASE-OUT DECELERATION OVER 3D TERRAIN
                const p3=(t-2.65)/1.50;
                // Smooth cubic ease-out deceleration curve
                const easeOut=1-Math.pow(1-p3,3.2);
                const zoom=10.85+(targetZoom-10.85)*easeOut;
                const pitch=42+(targetPitch-42)*easeOut;
                const bearing=(targetBearing-12)+12*easeOut;
                earthStarAlpha=0;
                earthCloudPhase=0.65+p3*0.35;
                earthCloudAlpha=Math.max(0,(1-p3*1.65)*0.45);
                earthMap.jumpTo({
                  center:[targetLon,targetLat],
                  zoom,
                  pitch,
                  bearing,
                  padding:{top:0,bottom:0,left:0,right:0}
                });
              }else{
                // STAGE 4: [4.15s - 5.80s] 2-SECOND FINAL VISTA HOLD ON THE LANDED LOCATION
                const p4=(t-4.15)/1.65;
                earthStarAlpha=0;
                earthCloudAlpha=0;
                earthMap.jumpTo({
                  center:[targetLon,targetLat],
                  zoom:targetZoom+p4*0.10,
                  pitch:targetPitch,
                  bearing:targetBearing+p4*3.5,
                  padding:{top:0,bottom:0,left:0,right:0}
                });
              }

              if(elapsed<duration){
                requestAnimationFrame(step);
              }else{
                earthCloudAlpha=0;
                earthStarAlpha=0;
                resolve();
              }
            }
            requestAnimationFrame(step);
          });
        }

        async function travel(targetPlanet,customZone){
          const next=typeof targetPlanet==='string'&&states[targetPlanet]?targetPlanet:states[current].next.toLowerCase();
          if(busy||!states[next]||(next===current&&next!=='earth'))return;
          busy=true;targetX=targetY=0;
          try{
            if(next==='earth'){
              const zone=customZone||(current==='earth'?pickNextEarthZone():activeEarthZone);
              syncEarthTelemetry(zone);

              if(earthMap&&earthMapReady){
                // Live 3D Google Earth Orbital-to-Surface Flight!
                portalVideo.pause();
                experience.classList.remove('is-loading','content-revealing','mask-revealing');
                experience.classList.add('is-transitioning');
                canvasOpacity=1;transitionActive=true;earthFlightActive=true;lunarFlightActive=false;
                await Promise.all([
                  animateValue(value=>expansion=value,950),
                  runEarth3DFlight(zone)
                ]);
                sceneCtx.clearRect(0,0,innerWidth,innerHeight);
                drawEarthEngineView(sceneCtx,performance.now());
                frozenScene=true;earthEngineActive=true;current='earth';
                experience.classList.add('is-committing');render();
                await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
                transitionActive=false;earthFlightActive=false;expansion=0;maskScale=0;canvasOpacity=1;
                experience.classList.remove('is-transitioning','is-committing');
                const maskReveal=revealMask();setTimeout(revealPlanetContent,100);await maskReveal;
                setTimeout(()=>{preloadNextTransition();busy=false;},400);
                return;
              }
            }else if(current==='earth'){
              earthEngineActive=false;
              pickNextEarthZone();
            }

            const transitionSrc=states[next].arrival||states[current].portal;
            const startTime=states[next].arrivalStart||0;
            portalVideo.pause();
            if(!transitionVideo.getAttribute('src')||!transitionVideo.src.endsWith(transitionSrc)){
              transitionVideo.src=transitionSrc;transitionVideo.load();
            }
            experience.classList.add('is-loading');await waitForMedia(transitionVideo,1800);
            experience.classList.remove('is-loading','content-revealing','mask-revealing');experience.classList.add('is-transitioning');transitionVideo.currentTime=startTime;transitionVideo.playbackRate=1.5;canvasOpacity=1;transitionActive=true;earthFlightActive=false;lunarFlightActive=false;
            const playback=transitionVideo.play();if(playback)await playback;await animateValue(value=>expansion=value,1100);await waitForEnd(transitionVideo);
            sceneCtx.clearRect(0,0,innerWidth,innerHeight);drawCover(sceneCtx,transitionVideo);frozenScene=true;current=next;
            if(current==='mars'&&earthMapReady)parkEarthInOrbit(activeEarthZone);
            experience.classList.add('is-committing');render();await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
            transitionActive=false;expansion=0;maskScale=0;canvasOpacity=1;experience.classList.remove('is-transitioning','is-committing');const maskReveal=revealMask();setTimeout(revealPlanetContent,100);await maskReveal;
            setTimeout(()=>{preloadNextTransition();busy=false;},450);
          }catch(error){
            transitionActive=false;earthFlightActive=false;lunarFlightActive=false;expansion=0;maskScale=1;canvasOpacity=1;experience.classList.remove('is-loading','is-transitioning','is-committing');busy=false;
          }
        }

        // Search Form & Quick Chips Handlers
        searchForm.addEventListener('submit',async event=>{
          event.preventDefault();
          if(busy)return;
          const q=searchInput.value.trim();
          const zone=await resolveLocationQuery(q);
          experience.classList.remove('is-loading');
          loadingLabel.textContent='Preparing orbit…';
          travel('earth',zone);
        });
        quickChipsWrap.addEventListener('click',event=>{
          const chip=event.target.closest('.earth-chip');
          if(!chip||busy)return;
          const zone=earthZones.find(z=>z.id===chip.dataset.zoneId);
          if(zone){
            searchInput.value=zone.labelAr;
            travel('earth',zone);
          }
        });

        portal.addEventListener('click',()=>travel());
        list.addEventListener('click',event=>{
          const item=event.target.closest('.planet-item');
          if(!item)return;
          travel(item.dataset.planet);
        });
        list.addEventListener('keydown',event=>{
          if(event.key!=='Enter'&&event.key!==' ')return;
          const item=event.target.closest('.planet-item');
          if(!item)return;
          event.preventDefault();
          travel(item.dataset.planet);
        });
        if(matchMedia('(pointer:fine)').matches){document.addEventListener('pointermove',event=>{if(!busy){targetY=(event.clientX/innerWidth-.5)*37.4;targetX=(event.clientY/innerHeight-.5)*-33;}});document.addEventListener('pointerleave',()=>{targetX=targetY=0;});}

        const cursor=document.getElementById('custom-cursor');let pointerX=innerWidth/2,pointerY=innerHeight/2,orbitX=pointerX,orbitY=pointerY;
        document.addEventListener('pointermove',event=>{pointerX=event.clientX;pointerY=event.clientY;cursor.classList.add('is-visible');});document.addEventListener('mouseleave',()=>cursor.classList.remove('is-visible'));
        portal.addEventListener('pointerenter',()=>cursor.classList.add('is-enter'));portal.addEventListener('pointerleave',()=>cursor.classList.remove('is-enter'));
        list.addEventListener('pointerover',event=>{const item=event.target.closest('.planet-item');cursor.classList.toggle('is-enter',Boolean(item&&item.dataset.planet!==current));});
        list.addEventListener('pointerleave',()=>cursor.classList.remove('is-enter'));
        function cursorLoop(){orbitX+=(pointerX-orbitX)*.2;orbitY+=(pointerY-orbitY)*.2;cursor.style.transform='translate3d('+orbitX+'px,'+orbitY+'px,0)';requestAnimationFrame(cursorLoop);}
        function parkBackgroundAtEnd(video){
          if(video.tagName!=='VIDEO')return;
          const seekEnd=()=>{if(video.duration&&Number.isFinite(video.duration)){video.pause();try{video.currentTime=Math.max(0,video.duration-.08);}catch(_){}}};
          if(video.readyState>=1)seekEnd();else video.addEventListener('loadedmetadata',seekEnd,{once:true});
        }
        function runPreloader(){
          const video=document.getElementById('preloader-video'),value=document.getElementById('preloader-value'),counter=document.getElementById('preloader-count'),logo=document.getElementById('floating-logo'),preloader=document.getElementById('preloader');let finished=false,raf=0;
          const update=()=>{if(video.duration&&Number.isFinite(video.duration))value.textContent=String(Math.round(video.currentTime/video.duration*100));raf=requestAnimationFrame(update);};
          const finish=()=>{if(finished)return;finished=true;cancelAnimationFrame(raf);parkBackgroundAtEnd(video);value.textContent='100';counter.classList.add('is-leaving');logo.classList.add('is-docked');preloader.classList.add('is-background');document.body.classList.add('preload-complete');startExperience();setTimeout(()=>counter.remove(),750);setTimeout(()=>logo.classList.add('is-settled'),2000);};
          if(new URLSearchParams(location.search).get('autostart')==='1'){
            if(video.readyState>=1)finish();else video.addEventListener('loadeddata',finish,{once:true});
            setTimeout(finish,1200);
            return;
          }
          const begin=()=>{if(video.duration&&Number.isFinite(video.duration))video.playbackRate=Math.max(.25,video.duration/3);video.play().then(()=>{update();}).catch(finish);};
          video.addEventListener('ended',finish,{once:true});setTimeout(finish,5000);if(video.readyState>=1)begin();else video.addEventListener('loadedmetadata',begin,{once:true});
        }
        window.addEventListener('resize',resizeCanvas);
        document.querySelectorAll('.background').forEach(parkBackgroundAtEnd);
        resizeCanvas();render();requestAnimationFrame(draw);requestAnimationFrame(cursorLoop);runPreloader();
      })();
    </script>
  </body>
</html>
